name: CLI PR checks

on:
  pull_request:
    paths:
      - "cli/edu/**"
      - ".github/workflows/cli-pr.yml"

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/edu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
          devbox-version: "0.18.4"
          project-path: cli/edu

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: edu-go-${{ hashFiles('cli/edu/go.sum') }}
          restore-keys: edu-go-

      - name: Lint
        run: devbox run -- make lint

      - name: Test
        run: devbox run -- make test
